server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 2048

spring:
  datasource:
    url: jdbc:h2:file:./data/moneytorch;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
  task:
    scheduling:
      pool:
        size: 4

moneytorch:
  tli-base-url: https://tli.re-side.dev
  icons-dir: ./data/icons
  backfill:
    enabled: true
    # empty = current season + previous standard season
    seasons: []
    sources: [poebench]
    # pause between history requests, be polite to tli.re-side.dev
    delay-ms: 350
